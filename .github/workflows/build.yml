name: CI

on:
  push:
    branches: [ pc_port ]
  pull_request:
    branches: [ pc_port ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Checkout syms
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@master
        with:
          path: symbols
          ref: symbols

      - name: Checkout agbcc
        uses: actions/checkout@master
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install binutils
        run: |
          sudo apt update
          sudo apt install gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev
        # build-essential and git are already installed
        # gcc-arm-none-eabi is only needed for the modern build
        # as an alternative to dkP

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: Compare
        run: make -j${nproc} all syms

      - name: Modern
        env:
          MODERN: 1
          COMPARE: 0
        run: make -j${nproc} all

      - name: Windows (64-bit)
        env:
          IS64BIT: 1
        run: make -j${nproc} winwsl

      - name: Windows (32-bit)
        env:
          IS64BIT: 0
        run: make -j${nproc} winwsl

      - name: Linux (64-bit)
        env:
          IS64BIT: 1
        run: make -j${nproc} linux

      - name: Linux (32-bit)
        env:
          IS64BIT: 0
        run: make -j${nproc} linux
